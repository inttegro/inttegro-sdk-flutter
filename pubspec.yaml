name: inttegro_flutter
description: Official Flutter SDK for Inttegro Checkout.
version: 0.3.0
homepage: https://flutter.inttegro.dev/
repository: https://github.com/inttegro/inttegro-sdk-flutter
issue_tracker: https://github.com/inttegro/inttegro-sdk-flutter/issues
topics:
  - payments
  - checkout
  - mobile-money
  - ghana
  - fintech

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.inttegro.flutter
        pluginClass: InttegroFlutterPlugin
      ios:
        pluginClass: InttegroFlutterPlugin
